[project]
name = "futu-data-mcp"
version = "0.1.0"
description = "Read-only Futubull (Futu/moomoo) market data MCP server for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "futu-api>=9.0.0",
]

[project.scripts]
futu-data-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
